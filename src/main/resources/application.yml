spring:
  application:
    name: skala-helpdesk-ai

  ai:
    openai:
      # 키는 소스에 넣지 않는다. export OPENAI_API_KEY="sk-..."
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: ${HELPDESK_PRIMARY_MODEL:gpt-4o-mini}
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-3-large
    chat:
      observations:
        log-prompt: false   # 운영에서는 프롬프트 원문 로깅을 반드시 끈다
      client:
        observations:
          log-prompt: false
      memory:
        repository:
          jdbc:
            # 기본값 embedded는 jdbc:h2:mem: 같은 진짜 인메모리 DB만 자동 초기화 대상으로
            # 인식한다 — jdbc:h2:file:은 "임베디드"로 감지되지 않아 스키마가 생성되지
            # 않았다(실제로 겪은 문제). 파일 DB에도 테이블을 만들도록 always로 명시한다.
            initialize-schema: always
            # 기본 스키마의 conversation_id VARCHAR(36)은 UUID 하나 기준이라
            # "tenantId:userId:sessionId" 형식(40자 이상)이 들어가면 INSERT가 매번
            # 실패했다(실제 운영 중 발견) — 컬럼을 넓힌 커스텀 스키마를 쓴다.
            schema: classpath:db/chat-memory-schema.sql

  datasource:
    url: jdbc:h2:file:./data/helpdesk;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update   # 주문·티켓·대화 메모리가 재시작 후에도 남아야 하므로 create-drop 금지
    open-in-view: false
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

helpdesk:
  rag:
    top-k: 4
    threshold: 0.4
  memory:
    max-messages: 20
  tokens:
    budget-per-query: 1500   # 강제하지 않는다 — ai.tokens 지표로 리뷰하는 용도
  model:
    primary: ${spring.ai.openai.chat.options.model}
    fallback: ${HELPDESK_FALLBACK_MODEL:gpt-4.1-mini}
  safety:
    sensitive-words:
      - 주민등록번호
      - 카드번호

resilience4j:
  circuitbreaker:
    instances:
      chatModel:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - java.lang.Exception

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: skala-helpdesk-ai

logging:
  level:
    com.skala.helpdesk: DEBUG
